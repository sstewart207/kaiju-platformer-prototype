<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123f43" />
    <title>Untitled Kaiju Project · Ruins</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E☀%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main id="game" aria-label="Untitled kaiju platforming game">
      <canvas id="world" aria-label="3D platforming course"></canvas>
      <div id="hud" hidden>
        <div class="identity">
          <span class="sun-mark">✦</span>
          <div>
            <strong>SOLARGON</strong
            ><span id="health" aria-label="Health 3 of 3">♥ ♥ ♥</span>
          </div>
        </div>
        <div class="run-stats">
          <span id="dash-status">DASH READY</span>
          <div class="dash-track"><i id="dash-meter"></i></div>
          <span id="solar-status">SOLAR READY</span>
          <div class="dash-track"><i id="solar-meter"></i></div>
        </div>
        <button class="pause-button" id="pause-button" aria-label="Pause game">
          Ⅱ
        </button>
      </div>
      <div id="controls" hidden>
        <span><kbd>W A S D</kbd> / <kbd>↑ ← ↓ →</kbd> MOVE</span
        ><span><kbd>SPACE</kbd> HOLD TO JUMP HIGHER</span
        ><span><kbd>R</kbd> RESTART</span>
      </div>
      <div id="overlay" class="overlay">
        <section class="menu" aria-labelledby="menu-title">
          <div class="eyebrow" id="menu-eyebrow"></div>
          <div class="menu-emblem">✦</div>
          <h1 id="menu-title">UNTITLED</h1>
          <div id="menu-subtitle">RUINS</div>
          <p id="menu-description"></p>
          <button id="primary-button" class="primary-button" disabled>
            Loading…
          </button>
          <button id="secondary-button" class="secondary-button" hidden>
            Start over
          </button>
          <p class="menu-footer" id="menu-footer">
            WASD / arrows Move · Space Jump · Shift Dash · Esc Pause
          </p>
        </section>
      </div>
      <div id="fade"></div>
      <div
        id="announcer"
        role="status"
        aria-live="polite"
        class="sr-only"
      ></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
